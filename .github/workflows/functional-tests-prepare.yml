---
#
# Workflow 1 of 2 ("prepare"): triggered on pull_request / push as usual.
# It adds one new image file, commits it to a new `ci/v1kr4yih-*` branch and pushes
# that branch. The push triggers "Functional Tests" (functional-tests.yml,
# workflow 2 of 2), which runs the action on the `ci/v1kr4yih-*` branch and deletes
# the branch when it is done.
name: Functional Tests (Prepare)

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/functional-tests-prepare.yml
      - .github/workflows/functional-tests.yml
      - src/**
      - action.yml
  pull_request:
    paths:
      - .github/workflows/functional-tests-prepare.yml
      - .github/workflows/functional-tests.yml
      - src/**
      - action.yml
  schedule:
    # Every Friday at 09:00 JST (moved from the old functional-tests.yml,
    # so the weekly run now exercises the whole prepare -> test chain)
    - cron: "0 0 * * 5"
  workflow_dispatch: {}

# Never prepare two ci/v1kr4yih-* branches for the same ref at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-added:
    name: Prepare "added" scenario
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Forks cannot create branches in this repository and do not have
    # access to this repository's secrets, so skip pull requests from forks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: "${{ secrets.GH_APP_CONTENTS_CRUD_CLIENT_ID }}"
          private-key: "${{ secrets.GH_APP_CONTENTS_CRUD_PRIVATE_KEY }}"

      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the header comment: this token (not GITHUB_TOKEN) is what
          # makes the push below trigger workflow 2.
          token: "${{ steps.app-token.outputs.token }}"
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: "true"

      - name: Download test file
        # Same fixture the commented-out step in the old
        # functional-tests.yml used, under a distinctive name so it can
        # never collide with a real file on main.
        run: |
          curl --fail --location \
            https://images-na.ssl-images-amazon.com/images/I/91cDPlxcRiL._SL1500_.jpg \
            --output nsfw-functional-test-added.jpg

      - name: Create ci/v1kr4yih-* branch and push the added file
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          # run_id + run_attempt keep the name unique across re-runs.
          # The name matches the "ci/v1kr4yih-*" branch filter of workflow 2.
          BRANCH_NAME: ci/v1kr4yih-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          user_name="${{ steps.app-token.outputs.app-slug }}[bot]"

          user_id="$(gh api "/users/${user_name}" --jq .id)"
          user_email="${user_id}+${user_name}@users.noreply.github.com"

          git config user.name "${user_name}"
          git config user.email "${user_email}"

          git checkout -b "${BRANCH_NAME}"
          git add nsfw-functional-test-added.jpg
          git commit -m "test(functional): add image for \"added\" scenario"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
